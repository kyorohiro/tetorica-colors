name: Build Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release version
        shell: pwsh
        run: |
          $expectedTag = "v$(node -p "require('./package.json').version")"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expectedTag."
          }

      - name: Build Windows installers
        uses: tauri-apps/tauri-action@v0.6.2

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: tetorica-colors-${{ github.ref_name }}-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
